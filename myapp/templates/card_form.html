{% extends 'base.html' %}

{% block title %}
Card | NovaBank
{% endblock %}


{% block content %}

<div class="auth-wrapper">

    <div class="panel auth-card">

        <h1>Bank Card</h1>

        <p class="description">
            Enter your card information.
        </p>


        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button class="btn btn-primary" type="submit">
                Save Card
            </button>

        </form>


        <div class="actions">

            <a href="{% url 'card_list' %}"
               class="btn btn-secondary">
                Cancel
            </a>

        </div>

    </div>

</div>

{% endblock %}
