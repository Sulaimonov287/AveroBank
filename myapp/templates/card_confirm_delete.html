{% extends 'base.html' %}

{% block title %}
Delete Card | NovaBank
{% endblock %}


{% block content %}

<div class="auth-wrapper">

    <div class="panel auth-card">

        <h1>Delete card?</h1>

        <p class="description">
            Are you sure you want to delete
            {{ card.card_number }}?
        </p>


        <form method="POST">

            {% csrf_token %}

            <button class="btn btn-danger"
                    type="submit">
                Yes, delete card
            </button>

        </form>


        <div class="actions">

            <a href="{% url 'card_detail' card.pk %}"
               class="btn btn-secondary">
                Cancel
            </a>

        </div>

    </div>

</div>

{% endblock %}
